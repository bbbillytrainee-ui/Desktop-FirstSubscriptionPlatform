<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mediverse Life Sciences — Professional Intelligence & Network</title>
    <meta name="description" content="A serious monthly publication and verified peer network for leaders building what healthcare becomes next across Pharma, MedTech, and AI-Health." />
    <meta property="og:title" content="Mediverse Life Sciences — Intelligence & Peer Network" />
    <meta property="og:description" content="Curated intelligence dossiers, 3D flipbook magazine editions, and verified peer introductions across Indian and APAC Life Sciences." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0D3B4A" />
    <!-- Apply the saved/system theme before first paint so dark mode never flashes light.
         Keep the storage key in sync with src/lib/theme.tsx. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("mediverse_theme")
          if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
          var root = document.documentElement
          if (t === "dark") root.classList.add("dark")
          root.setAttribute("data-theme", t)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
