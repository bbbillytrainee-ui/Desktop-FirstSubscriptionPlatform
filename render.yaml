services:
  - type: web
    name: mediverse-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install uv && uv sync --frozen
    startCommand: >
      gunicorn app.main:app
      --worker-class uvicorn.workers.UvicornWorker
      --workers 1
      --bind 0.0.0.0:$PORT
      --timeout 120
      --graceful-timeout 30
      --access-logfile -
      --error-logfile -
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_DOMAIN
        value: .mediverselifesciences.com
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: EMAIL_BACKEND
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "2"
