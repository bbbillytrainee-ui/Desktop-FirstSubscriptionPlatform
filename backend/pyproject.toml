[project]
name = "mediverse-api"
version = "0.1.0"
description = "Mediverse Life Sciences API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.29",
    "email-validator>=2.1",
    "fastapi>=0.115",
    "gunicorn>=22",
    "httpx>=0.27",
    "nh3>=0.2",
    "pwdlib[argon2]>=0.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt>=2.8",
    "sqlalchemy[asyncio]>=2.0.30",
    "uvicorn[standard]>=0.30",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "ASYNC", "S"]
ignore = ["S101"]  # assert is fine in tests and for internal invariants

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
"tests/*" = ["S105", "S106"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
